  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="">
  <meta property="og:title" content="Freelance Flutter Developer - Vlad Antohi" />
  <meta property="og:description" content="" />
  <meta property="og:url" content="https://vladantohi.net" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Freelance Flutter Developer - Vlad Antohi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Freelance Flutter Developer - Vlad Antohi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }

    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #F7F9FB;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #C3C7CF;
      transition: opacity 300ms ease-out;
      z-index: 9999;
    }

    @media (prefers-color-scheme: dark) {
      #flutter-loading { background-color: #0F1419; }
    }

    #flutter-loading.flutter-loading-hidden { opacity: 0; pointer-events: none; }

    #flutter-loading-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid rgba(2, 83, 154, 0.25);
      border-top-color: #02539A;
      animation: flutter-loading-rotate 900ms linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      #flutter-loading-spinner {
        border-color: rgba(166, 200, 255, 0.25);
        border-top-color: #A6C8FF;
      }
    }

    @keyframes flutter-loading-rotate {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="flutter-loading" aria-label="Loading">
    <div id="flutter-loading-spinner"></div>
    <div>LOADING</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('flutter-loading');
      if (loader) {
        loader.classList.add('flutter-loading-hidden');
        loader.addEventListener('transitionend', function () { loader.remove(); });
        setTimeout(function () { loader.remove(); }, 1000);
      }
    });
  </script>
</body>
</html>
